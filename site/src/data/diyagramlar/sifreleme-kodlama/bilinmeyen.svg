<svg viewBox="0 0 700 290" role="img" aria-label="Daire 3 ve daire artı kalp 8 ise, dairenin yerine 3 konur: 3 artı kalp 8 eder, kalp 5 olur. Bulunan değer tabloya eklenir." xmlns="http://www.w3.org/2000/svg"><text x="30" y="64" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#6B5BFF" text-anchor="start">1</text><circle cx="110" cy="58" r="15" fill="#6AAE2A" stroke="#37474F" stroke-width="2"/><text x="140" y="65" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B1846" text-anchor="start">= 3</text><text x="30" y="130" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#6B5BFF" text-anchor="start">2</text><circle cx="110" cy="124" r="15" fill="#6AAE2A" stroke="#37474F" stroke-width="2"/><text x="145" y="131" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#4A4670" text-anchor="middle">+</text><path d="M180,136.6 C151.5,121.6 167.4,102.4 180,116.8 C192.6,102.4 208.5,121.6 180,136.6 Z" fill="#F0507A" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/><text x="208" y="131" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B1846" text-anchor="start">= 8</text><line x1="110" y1="144" x2="110" y2="170" stroke="#6B5BFF" stroke-width="3" stroke-linecap="round"/><polygon points="110,178 104.3,166.3 115.7,166.3" fill="#6B5BFF"/><text x="124" y="167" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#6B5BFF" text-anchor="start">dairenin yerine 3 koy</text><text x="30" y="202" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#6B5BFF" text-anchor="start">3</text><text x="110" y="202" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#6B5BFF" text-anchor="middle">3</text><text x="145" y="202" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#4A4670" text-anchor="middle">+</text><path d="M180,207.6 C151.5,192.6 167.4,173.4 180,187.8 C192.6,173.4 208.5,192.6 180,207.6 Z" fill="#F0507A" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/><text x="208" y="202" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B1846" text-anchor="start">= 8</text><text x="30" y="262" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#6B5BFF" text-anchor="start">4</text><path d="M110,267.6 C81.5,252.6 97.4,233.4 110,247.8 C122.6,233.4 138.5,252.6 110,267.6 Z" fill="#F0507A" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/><text x="140" y="262" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B1846" text-anchor="start">= 8 − 3 = 5</text><rect x="470" y="58" width="210" height="180" rx="14" fill="#F4F3FB" stroke="#6B5BFF" stroke-width="2"/><text x="575" y="88" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" fill="#6B5BFF" text-anchor="middle">tablom</text><circle cx="530" cy="128" r="15" fill="#6AAE2A" stroke="#37474F" stroke-width="2"/><text x="560" y="135" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B1846" text-anchor="start">= 3</text><rect x="492" y="164" width="166" height="52" rx="10" fill="#E6FAF1" stroke="#0E7A4B" stroke-width="2"/><path d="M530,202.6 C501.5,187.6 517.4,168.4 530,182.8 C542.6,168.4 558.5,187.6 530,202.6 Z" fill="#F0507A" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/><text x="560" y="197" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="900" fill="#1B1846" text-anchor="start">= 5</text><text x="630" y="197" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="800" fill="#0E7A4B" text-anchor="middle">yeni</text><line x1="282" y1="252" x2="478.2" y2="203.9" stroke="#0E7A4B" stroke-width="2.5" stroke-linecap="round"/><polygon points="486,202 476,210.3 473.3,199.3" fill="#0E7A4B"/></svg>
