<svg viewBox="0 0 720 290" role="img" aria-label="Dört şık: kırmızı daire, kırmızı kare, mavi daire, kırmızı üçgen. Kırmızı mı kuralında yalnız C uymuyor, yani tek farklı var ve kural doğru. Daire mi kuralında B ve D uymuyor, iki farklı çıktığı için bu kural doğru kural değil." xmlns="http://www.w3.org/2000/svg"><text x="24" y="30" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="800" fill="#1B1846" text-anchor="start">Kuralı bütün şıklarda dene</text><rect x="195" y="44" width="90" height="80" rx="12" fill="#F4F3FB"/><text x="208" y="64" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B1846" text-anchor="start">A</text><rect x="315" y="44" width="90" height="80" rx="12" fill="#F4F3FB"/><text x="328" y="64" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B1846" text-anchor="start">B</text><rect x="435" y="44" width="90" height="80" rx="12" fill="#F4F3FB"/><text x="448" y="64" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B1846" text-anchor="start">C</text><rect x="555" y="44" width="90" height="80" rx="12" fill="#F4F3FB"/><text x="568" y="64" font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="900" fill="#1B1846" text-anchor="start">D</text><circle cx="240" cy="88" r="20" fill="#E53935" stroke="#37474F" stroke-width="2.2"/><rect x="341" y="69" width="38" height="38" rx="3" fill="#E53935" stroke="#37474F" stroke-width="2.2"/><circle cx="480" cy="88" r="20" fill="#4F8EF7" stroke="#37474F" stroke-width="2.2"/><polygon points="600,67.1 577,106.9 623,106.9" fill="#E53935" stroke="#37474F" stroke-width="2.2" stroke-linejoin="round"/><text x="24" y="168" font-family="Nunito, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1846" text-anchor="start">Kural: kırmızı mı?</text><polyline points="228,160 236.4,168.4 252,150.4" fill="none" stroke="#12A57A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline poin