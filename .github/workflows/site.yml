# bilsemnova.com: site/ klasöründeki Astro sitesini derleyip GitHub Pages'e yayınlar.
# Sosyal medya görselleri (paylasim/medya) aynı adreste kalsın diye yayına eklenir;
# paylaşım sistemi Meta'ya bu görsellerin bilsemnova.com adresini veriyor.
name: Site yayını

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'paylasim/medya/**'
      - 'CNAME'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Bağımlılıklar
        working-directory: site
        run: npm ci
      - name: Derle
        working-directory: site
        run: npx astro build
      - name: Sosyal medya görsellerini ve alan adını ekle
        run: |
          mkdir -p site/dist/paylasim
          cp -R paylasim/medya site/dist/paylasim/
          cp CNAME site/dist/CNAME
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v5
